services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      # Optional — if unset, a secret is generated once and persisted to
      # data/.app-secret, so existing sessions survive restarts.
      APP_SECRET: ${APP_SECRET:-}
      # Optional — SQLite file location. Defaults to ./data/night-journal.sqlite
      DATABASE_URL: ${DATABASE_URL:-}
      OWNER_UNION_ID: ${OWNER_UNION_ID:-}
    volumes:
      # Persists the embedded SQLite database and generated APP_SECRET.
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
